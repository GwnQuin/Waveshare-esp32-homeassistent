# =============================================================================
# Waveshare ESP32-S3-Touch-LCD-1.85C (hardwareversie V1)
# als spraakassistent voor Home Assistant - COMPLEET BESTAND
#
# Alles staat in dit ene bestand; er zijn geen pakketten of downloads van deze
# repository nodig. Plak de hele inhoud in je apparaat in de ESPHome Device
# Builder en pas alleen deze dingen aan:
#   1. api > encryption > key: de sleutel die ESPHome voor je apparaat maakte
#   2. wifi: zorg dat wifi_ssid en wifi_password in je ESPHome-Secrets staan
#   3. weather_entity (bij substitutions): alleen als je weer-entiteit in
#      Home Assistant niet weather.forecast_home heet
#
# Voor de weersverwachting: zet in Home Assistant bij dit apparaat
# (Instellingen > Apparaten & diensten > ESPHome > apparaat > Configureren)
# "Sta het apparaat toe om Home Assistant-acties uit te voeren" aan.
#
# Vereist ESPHome 2026.9 of nieuwer.
# Bron: https://github.com/GwnQuin/Waveshare-esp32-homeassistent
#
# Scherm   : 1.85" rond 360x360, ST77916 via QSPI
# Touch    : CST816 (I2C GPIO11/GPIO10)
# Audio    : I2S MEMS-microfoon + PCM5101 DAC met speaker
# Overig   : TCA9554 IO-expander (reset scherm/touch)
#
# Scherm:  swipe naar links = weer + verwachting, naar rechts = bediening.
#          Draai langs de rand = volume. Tik op de microfoonknop om te praten.
#          Gaat een timer af, zeg dan "stop" of tik op het scherm.
# =============================================================================

substitutions:
  name: rond-assistent
  friendly_name: Rond Assistent
  phase_idle: "1"
  phase_listening: "2"
  phase_thinking: "3"
  phase_replying: "4"
  phase_not_ready: "10"
  phase_error: "11"
  phase_muted: "12"
  phase_timer_finished: "20"
  # Weer-entiteit uit Home Assistant (standaard van de Met.no-integratie).
  weather_entity: weather.forecast_home
  color_idle: "0x263238"
  color_listening: "0x2196F3"
  color_listening_dark: "0x1565C0"
  color_thinking: "0xFF9800"
  color_replying: "0x4CAF50"
  color_error: "0xE53935"
  color_muted: "0x6D1B1B"
  color_text: "0xFFFFFF"
  color_text_dim: "0x9E9E9E"
  color_card: "0x1C2733"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: gwnquin.waveshare-rond-assistent
    version: "1.0.0"
  on_boot:
    - priority: -100
      then:
        - lambda: id(ui_ready) = true;
        - lvgl.slider.update:
            id: brightness_slider
            value: !lambda return id(screen_brightness).state;
        - script.execute: sync_volume
        - script.execute: update_clock
        - script.execute: update_ui
        - script.execute: screen_wake
        # Geef WiFi/HA even de tijd; daarna mogen fouten weer op het scherm.
        - delay: 30s
        - lambda: id(init_in_progress) = false;
        - script.execute: update_ui

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: "PLAK-HIER-JE-EIGEN-SLEUTEL"
  on_client_connected:
    - script.execute: update_ui
  on_client_disconnected:
    - script.execute: update_ui

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
  on_connect:
    - script.execute: update_ui
  on_disconnect:
    - script.execute: update_ui

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: va_phase
    type: int
    restore_value: false
    initial_value: ${phase_not_ready}
  # Naam van de timer die afgaat ("pasta", ...), voor op het scherm
  - id: finished_timer_name
    type: std::string
    restore_value: false
  # LVGL is klaar (gezet in on_boot); daarvoor geen schermupdates.
  - id: ui_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: timer_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: timer_view_shown
    type: bool
    restore_value: false
    initial_value: "false"
  - id: timer_text
    type: std::string
    restore_value: false
  - id: timer_name
    type: std::string
    restore_value: false
  - id: timer_end_text
    type: std::string
    restore_value: false
  - id: timer_progress
    type: int
    restore_value: false
    initial_value: "0"
  - id: weather_valid
    type: bool
    restore_value: false
    initial_value: "false"
  - id: weather_tint
    type: uint32_t
    restore_value: false
    initial_value: "0x101820"
  # Weersverwachting (max. 4 dagen), gevuld door fetch_forecast
  - id: fc_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: fc_day
    type: std::array<std::string, 4>
    restore_value: false
  - id: fc_cond
    type: std::array<std::string, 4>
    restore_value: false
  - id: fc_temp
    type: std::array<std::string, 4>
    restore_value: false

i2c:
  - id: i2c_main
    sda: GPIO11
    scl: GPIO10
    # Toont bij het opstarten welke chips er zijn (zie de logs).
    scan: true

pca9554:
  - id: io_expander
    i2c_id: i2c_main
    address: 0x20

spi:
  - id: lcd_qspi
    type: quad
    clk_pin: GPIO40
    data_pins:
      - number: GPIO46
        ignore_strapping_warning: true
      - number: GPIO45
        ignore_strapping_warning: true
      - GPIO42
      - GPIO41

display:
  - platform: mipi_spi
    id: lcd
    # Waveshare's "nieuwe" ST77916-init (zelfde als ESPHome's ESP-VOCAT).
    # Ruis of strepen? Zie "scherm-oud-paneel.yaml" in de repository.
    model: ESP-VOCAT
    spi_id: lcd_qspi
    cs_pin: GPIO21
    # EXIO2 op de TCA9554 (bit 1) = LCD reset
    reset_pin:
      pca9554: io_expander
      number: 1
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: i2c_main
    interrupt_pin: GPIO4
    # EXIO1 op de TCA9554 (bit 0) = touch reset
    reset_pin:
      pca9554: io_expander
      number: 0
    on_touch:
      - script.execute: screen_touched

# --- Audio: aparte I2S-bussen voor microfoon en speaker (full duplex) ---
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO15
  - id: i2s_speaker_bus
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48

microphone:
  - platform: i2s_audio
    id: mic_in
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    channel: right
    sample_rate: 16000
    # De MEMS-microfoon wil minimaal ~1 MHz bitklok: 32-bit slots bij 16 kHz.
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_speaker_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 100ms

media_player:
  - platform: speaker
    id: speaker_media_player
    name: None
    volume_min: 0.4
    volume_max: 0.85
    announcement_pipeline:
      speaker: speaker_out
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    on_announcement:
      # Op borden met één gedeelde I2S-bus kan de microfoon niet tegelijk
      # met de speaker draaien: wake word tijdelijk stoppen.
      - if:
          condition:
            microphone.is_capturing: mic_in
          then:
            - micro_wake_word.stop:
      # Mededeling vanuit Home Assistant (geen gesprek): scherm aan.
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: screen_wake
    on_state:
      - script.execute: sync_volume
    on_idle:
      # Einde van een mededeling buiten een gesprek: wake word weer aan.
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word

micro_wake_word:
  id: mww
  microphone: mic_in
  # Kies in Home Assistant welk wake word actief is (apparaatpagina >
  # Assist-satelliet > Wake word).
  models:
    - model: okay_nabu
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    # "Stop": alleen actief terwijl een timer afgaat (zoals de Voice PE).
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    - script.execute: screen_wake
    # Gaat er een timer af? Dan stopt elk wake word (of "stop") het alarm.
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
        else:
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic_in
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: id(va_phase) = ${phase_listening};
    - lvgl.label.update:
        id: lbl_text
        text: "..."
    - script.execute: screen_wake
    - script.execute: update_ui
  on_stt_vad_end:
    - lambda: id(va_phase) = ${phase_thinking};
    - script.execute: update_ui
  on_stt_end:
    - lvgl.label.update:
        id: lbl_text
        text: !lambda return x;
  on_tts_start:
    - lambda: id(va_phase) = ${phase_replying};
    - lvgl.label.update:
        id: lbl_text
        text: !lambda return x;
    - script.execute: screen_wake
    - script.execute: update_ui
  on_end:
    # Wacht tot het antwoord is uitgesproken en de I2S-bus vrij is.
    - wait_until:
        condition:
          media_player.is_announcing: speaker_media_player
        timeout: 0.5s
    - wait_until:
        condition:
          and:
            - not:
                media_player.is_announcing: speaker_media_player
            - not:
                speaker.is_playing: speaker_out
    # Wake word direct weer aanzetten. Niet via start_wake_word: op dit
    # moment telt de assistent nog als "bezig", waardoor het wake word na
    # het eerste gesprek uit bleef.
    - if:
        condition:
          not:
            micro_wake_word.is_running:
        then:
          - micro_wake_word.start:
    - if:
        condition:
          lambda: return id(va_phase) != ${phase_error} && id(va_phase) != ${phase_timer_finished};
        then:
          - script.execute: set_idle_or_mute_phase
          - script.execute: update_ui
          - script.execute: screen_wake
  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - lambda: id(va_phase) = ${phase_error};
          - lvgl.label.update:
              id: lbl_text
              text: !lambda return message;
          - script.execute: screen_wake
          - script.execute: update_ui
          - delay: 3s
          - if:
              condition:
                lambda: return id(va_phase) == ${phase_error};
              then:
                - script.execute: set_idle_or_mute_phase
                - script.execute: update_ui
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: update_ui
    - delay: 5s
    - script.execute: fetch_forecast
  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(va_phase) = ${phase_not_ready};
    - script.execute: update_ui
  on_timer_started:
    - script.execute: update_timer
  on_timer_updated:
    - script.execute: update_timer
  # ESPHome meldt "gestopt"/"klaar" terwijl de timer nog in de lijst staat;
  # even wachten tot hij eruit is, anders blijft het scherm op 00:00 staan.
  on_timer_cancelled:
    - delay: 100ms
    - script.execute: update_timer
  on_timer_tick:
    - script.execute: update_timer
  on_timer_finished:
    - lambda: id(finished_timer_name) = timer.name;
    - switch.turn_on: timer_ringing
    - delay: 100ms
    - script.execute: update_timer

# --- Achtergrondverlichting (GPIO5 op alle varianten) ---
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO5

light:
  - platform: monochromatic
    id: backlight
    name: Scherm
    icon: mdi:television
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

number:
  - platform: template
    id: screen_brightness
    name: Schermhelderheid
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: screen_wake
      - if:
          condition:
            lambda: return id(ui_ready);
          then:
            - lvgl.slider.update:
                id: brightness_slider
                value: !lambda return x;
  - platform: template
    id: screen_dim_brightness
    name: Helderheid in rust
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
  - platform: template
    id: screen_timeout
    name: Scherm dimmen na
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true

switch:
  - platform: template
    id: mute
    name: Microfoon uit
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - microphone.mute: mic_in
      - if:
          condition:
            lambda: return id(va_phase) == ${phase_idle};
          then:
            - lambda: id(va_phase) = ${phase_muted};
      - script.execute: update_ui
    on_turn_off:
      - microphone.unmute: mic_in
      - if:
          condition:
            lambda: return id(va_phase) == ${phase_muted};
          then:
            - lambda: id(va_phase) = ${phase_idle};
      - script.execute: update_ui
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - micro_wake_word.enable_model: stop
      - lambda: id(va_phase) = ${phase_timer_finished};
      - script.execute: screen_wake
      - script.execute: update_ui
      - script.execute: timer_alarm
      - script.execute: alarm_blink
    on_turn_off:
      - script.stop: timer_alarm
      - script.stop: alarm_blink
      - micro_wake_word.disable_model: stop
      - if:
          condition:
            media_player.is_announcing: speaker_media_player
          then:
            - media_player.stop:
                id: speaker_media_player
                announcement: true
      - if:
          condition:
            lambda: return id(va_phase) == ${phase_timer_finished};
          then:
            - script.execute: set_idle_or_mute_phase
            - script.execute: update_ui
      - script.execute: start_wake_word

# --- BOOT-knop (GPIO0, aanwezig op alle varianten) ---
#   kort drukken : praten / stoppen / timer-alarm uitzetten
#   1 s vasthouden: microfoon aan/uit
binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    internal: true
    on_multi_click:
      - timing:
          - ON for at most 800ms
          - OFF for at least 50ms
        then:
          - script.execute: screen_wake
          - script.execute: talk_pressed
      - timing:
          - ON for at least 1s
        then:
          - script.execute: screen_wake
          - switch.toggle: mute

button:
  - platform: restart
    name: Herstarten
    entity_category: diagnostic
  # Speaker testen zonder de spraakassistent
  - platform: template
    name: Testgeluid afspelen
    icon: mdi:volume-high
    entity_category: diagnostic
    on_press:
      - media_player.speaker.play_on_device_media_file:
          id: speaker_media_player
          media_file: timer_finished_sound
          announcement: true

sensor:
  - platform: wifi_signal
    name: WiFi-signaal
    update_interval: 60s
    entity_category: diagnostic
  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      - script.execute: update_weather
  - platform: homeassistant
    id: weather_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
    on_value:
      - script.execute: update_weather
  - platform: homeassistant
    id: weather_wind
    entity_id: ${weather_entity}
    attribute: wind_speed
    internal: true
    on_value:
      - script.execute: update_weather

# --- Weer uit Home Assistant ---
text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    internal: true
    on_value:
      - script.execute: update_weather
  - platform: homeassistant
    id: weather_wind_unit
    entity_id: ${weather_entity}
    attribute: wind_speed_unit
    internal: true

interval:
  - interval: 30min
    then:
      - script.execute: fetch_forecast

font:
  - file:
      type: gfonts
      family: Figtree
      weight: 600
    id: font_clock
    size: 88
    glyphs: "0123456789:-"
  - file:
      type: gfonts
      family: Figtree
      weight: 600
    id: font_mid
    size: 56
    glyphs: "0123456789:-°%"
  - file:
      type: gfonts
      family: Figtree
      weight: 600
    id: font_title
    size: 26
    glyphsets: [GF_Latin_Core]
  - file: gfonts://Figtree
    id: font_text
    size: 22
    glyphsets: [GF_Latin_Core]
  - file: gfonts://Figtree
    id: font_small
    size: 18
    glyphsets: [GF_Latin_Core]
  # Material Symbols, codepoints uit MaterialSymbolsOutlined.codepoints
  - file: gfonts://Material+Symbols+Outlined
    id: font_icons
    size: 26
    glyphs:
      - "\U0000e31d" # mic
      - "\U0000e02b" # mic_off
      - "\U0000e648" # wifi_off
      - "\U0000e16f" # link_off
      - "\U0000e798" # water_drop
      - "\U0000efd8" # air
      - "\U0000e1ad" # brightness_low
      - "\U0000e1ac" # brightness_high
  - file: gfonts://Material+Symbols+Outlined
    id: font_icons_weather
    size: 36
    glyphs: &weather_glyphs
      - "\U0000f157" # clear_day
      - "\U0000f159" # clear_night
      - "\U0000f172" # partly_cloudy_day
      - "\U0000f15c" # cloud
      - "\U0000e818" # foggy
      - "\U0000f176" # rainy
      - "\U0000f61f" # rainy_heavy
      - "\U0000e2cd" # weather_snowy
      - "\U0000f60b" # weather_mix
      - "\U0000f67f" # weather_hail
      - "\U0000ebdb" # thunderstorm
      - "\U0000efd8" # air
      - "\U0000f083" # warning
  - file: gfonts://Material+Symbols+Outlined
    id: font_icons_xl
    size: 84
    glyphs: *weather_glyphs
  - file: gfonts://Material+Symbols+Outlined
    id: font_icons_big
    size: 40
    glyphs:
      - "\U0000e31d" # mic
      - "\U0000e02b" # mic_off
      - "\U0000e51c" # dark_mode
      - "\U0000e050" # volume_up
      - "\U0000e04d" # volume_down
      - "\U0000e04f" # volume_off

lvgl:
  id: lvgl_ui
  displays:
    - lcd
  touchscreens:
    - touch
  bg_color: 0x000000
  text_color: ${color_text}
  default_font: font_text
  pages:
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      widgets:
        # ================= Pagina's (swipen) =================
        - tileview:
            id: tiles
            align: CENTER
            width: 360
            height: 360
            bg_opa: TRANSP
            scrollbar_mode: "OFF"
            on_value:
              - script.execute: screen_wake
            tiles:
              # ---------- Home (eerste = startpagina) ----------
              - id: tile_home
                row: 0
                column: 1
                dir: HOR
                bg_opa: COVER
                bg_color: 0x0D1B2A
                bg_grad_color: 0x000000
                bg_grad_dir: VER
                scrollable: false
                widgets:
                  - obj:
                      id: weather_row
                      align: TOP_MID
                      y: 56
                      width: SIZE_CONTENT
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      clickable: false
                      hidden: true
                      layout:
                        type: flex
                        pad_column: 6
                        flex_flow: ROW
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            id: lbl_weather_icon
                            text_font: font_icons_weather
                            text: ""
                        - label:
                            id: lbl_weather_temp
                            text_font: font_title
                            text: ""
                        - label:
                            id: lbl_weather_cond
                            text_font: font_small
                            text_color: ${color_text_dim}
                            text: ""
                  - label:
                      id: lbl_notice
                      align: TOP_MID
                      y: 64
                      text_font: font_title
                      text_color: ${color_text_dim}
                      text: ""
                      hidden: true

                  # Klok
                  - label:
                      id: lbl_time
                      align: CENTER
                      y: -6
                      text_font: font_clock
                      text: "--:--"
                  - label:
                      id: lbl_date
                      align: CENTER
                      y: 62
                      text_font: font_text
                      text_color: ${color_text_dim}
                      text: ""

