# Hardware: Waveshare ESP32-S3-Touch-LCD-1.85C, hardwareversie V1
# (ook de 1.85C-BOX die vóór februari 2026 is verkocht)
#
#   Scherm   : 1.85" rond 360x360, ST77916 via QSPI
#   Touch    : CST816 op de gedeelde I2C-bus (GPIO11/GPIO10)
#   Audio    : I2S MEMS-microfoon + PCM5101 DAC met speaker
#   Overig   : TCA9554 IO-expander (reset scherm/touch)
#
# Pinnen komen uit Waveshare's eigen board-code in de xiaozhi-esp32 firmware
# (main/boards/waveshare/esp32-s3-touch-lcd-1.85c, CONFIG_VERSION_1_0).
#
# Dit bestand levert de ids die de gedeelde pakketten verwachten:
#   lcd, touch, mic_in, speaker_out

i2c:
  - id: i2c_main
    sda: GPIO11
    scl: GPIO10
    # Toont bij het opstarten welke chips er zijn (zie README > Welke variant).
    scan: true

pca9554:
  - id: io_expander
    i2c_id: i2c_main
    address: 0x20

spi:
  - id: lcd_qspi
    type: quad
    clk_pin: GPIO40
    data_pins:
      - number: GPIO46
        ignore_strapping_warning: true
      - number: GPIO45
        ignore_strapping_warning: true
      - GPIO42
      - GPIO41

display:
  - platform: mipi_spi
    id: lcd
    # Waveshare's "nieuwe" ST77916-init (zelfde als ESPHome's ESP-VOCAT).
    # Ruis of strepen? Voeg dan boards/scherm-oud-paneel.yaml toe.
    model: ESP-VOCAT
    spi_id: lcd_qspi
    cs_pin: GPIO21
    # EXIO2 op de TCA9554 (bit 1) = LCD reset
    reset_pin:
      pca9554: io_expander
      number: 1
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: i2c_main
    interrupt_pin: GPIO4
    # EXIO1 op de TCA9554 (bit 0) = touch reset
    reset_pin:
      pca9554: io_expander
      number: 0
    on_touch:
      - script.execute: screen_touched

# --- Audio: aparte I2S-bussen voor microfoon en speaker (full duplex) ---
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO15
  - id: i2s_speaker_bus
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48

microphone:
  - platform: i2s_audio
    id: mic_in
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    channel: right
    sample_rate: 16000
    # De MEMS-microfoon wil minimaal ~1 MHz bitklok: 32-bit slots bij 16 kHz.
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_speaker_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 100ms
